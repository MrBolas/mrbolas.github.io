<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MrBolas - Senior Software Engineer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.15);
            max-width: 800px;
            width: 100%;
            padding: 3rem;
        }

        h1 {
            font-size: 2.5rem;
            color: #1a202c;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .subtitle {
            font-size: 1.25rem;
            color: #4a5568;
            margin-bottom: 2rem;
            font-weight: 400;
        }

        .section {
            margin-bottom: 2rem;
        }

        .section-title {
            font-size: 1.1rem;
            color: #2d3748;
            font-weight: 600;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tech-stack {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .tech-item {
            background: linear-gradient(135deg, #f6f8fa 0%, #eaeef2 100%);
            color: #24292e;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 500;
            border: 1px solid #d0d7de;
        }

        .tech-category {
            margin-top: 2rem;
        }

        .tech-category-title {
            font-size: 0.85rem;
            color: #6a737d;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.75rem;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .container {
                padding: 2rem;
            }

            h1 {
                font-size: 2rem;
            }

            .tech-stack {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>MrBolas</h1>
        <p class="subtitle">Senior Software Engineer | Barreiro, Portugal</p>

        <div class="section">
            <div class="section-title">Core Technologies</div>
            <div class="tech-stack">
                <span class="tech-item">Go</span>
                <span class="tech-item">TypeScript</span>
                <span class="tech-item">JavaScript</span>
                <span class="tech-item">Python</span>
                <span class="tech-item">Java</span>
                <span class="tech-item">C++</span>
                <span class="tech-item">C</span>
            </div>
        </div>

        <div class="section tech-category">
            <div class="tech-category-title">Infrastructure & Tools</div>
            <div class="tech-stack">
                <span class="tech-item">TrueNAS</span>
                <span class="tech-item">Raspberry Pi</span>
                <span class="tech-item">Orange Pi</span>
                <span class="tech-item">GitHub Actions</span>
            </div>
        </div>

        <div class="section tech-category">
            <div class="tech-category-title">Frameworks & Libraries</div>
            <div class="tech-stack">
                <span class="tech-item">LangChain</span>
                <span class="tech-item">Angular</span>
            </div>
        </div>

        <div class="section tech-category">
            <div class="tech-category-title">Specializations</div>
            <div class="tech-stack">
                <span class="tech-item">LLM Operations</span>
                <span class="tech-item">Homelab Systems</span>
                <span class="tech-item">IoT Development</span>
            </div>
        </div>
    </div>
</body>
</html>
